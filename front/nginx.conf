server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Requisições do navegador em /api/* são repassadas para o container "api"
    # usando o DNS interno da network do Docker Compose.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
