services:
  postgres:
    image: postgres:16-alpine
    container_name: prova_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    image: prova_api:latest
    container_name: prova_api
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    ports:
      - "${API_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db_net
      - app_net

  front:
    build:
      context: ../front
      dockerfile: Dockerfile
    image: prova_front:latest
    container_name: prova_front
    restart: unless-stopped
    ports:
      - "${FRONT_PORT}:80"
    depends_on:
      - api
    networks:
      - app_net

networks:
  db_net:
    driver: bridge
  app_net:
    driver: bridge

volumes:
  postgres_data: